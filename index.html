<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalWave Radio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js for 3D Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-light: #f0f2f5;
            --text-light: #1f2937;
            --card-light-bg: rgba(255, 255, 255, 0.5);
            --sub-text-light: #6b7280;

            --bg-dark: #0f172a; /* Dark Slate background */
            --text-dark: #f9fafb;
            --card-dark-bg: rgba(30, 41, 59, 0.5); /* Darker Slate for cards */
            --sub-text-dark: #9ca3af;
        }
        html.light {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --card-bg-color: var(--card-light-bg);
            --sub-text-color: var(--sub-text-light);
            --slider-track: #e5e7eb;
            --slider-thumb: #4f46e5;
            --card-border-color: rgba(255, 255, 255, 0.7);
        }
        html.dark {
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --card-bg-color: var(--card-dark-bg);
            --sub-text-color: var(--sub-text-dark);
            --slider-track: #4b5563;
            --slider-thumb: #818cf8;
            --card-border-color: rgba(75, 85, 99, 0.7);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden; /* Prevent scrollbars from main content */
        }
        #interactive-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: -1;
        }
        /* Glassmorphism UI */
        .glass-card {
            background: var(--card-bg-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .station-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        html.dark .station-item:hover {
             box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .skeleton {
            background-color: #e5e7eb; border-radius: 0.5rem;
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        html.dark .skeleton { background-color: #374151; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { height: 6px; cursor: pointer; background: var(--slider-track); border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; margin-top: -5px; }
        input[type=range]::-moz-range-track { height: 6px; cursor: pointer; background: var(--slider-track); border-radius: 3px; }
        input[type=range]::-moz-range-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: none; }

        #map-container {
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
            position: relative; /* For loading indicator */
            cursor: grab;
        }
        #map-container:active { cursor: grabbing; }

        #map-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-color);
            font-size: 1.2rem;
            background-color: var(--card-bg-color);
            padding: 1rem 2rem;
            border-radius: 1rem;
        }
        #map-tooltip {
            position: absolute;
            display: none;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none; /* So it doesn't interfere with mouse events on the canvas */
            white-space: nowrap;
            z-index: 100;
        }
    </style>
</head>

    <script type="module">
        // --- INTERACTIVE BACKGROUND SCRIPT ---
        const bgCanvas = document.getElementById('interactive-bg');
        // ... (background script remains the same)
        
        // --- MAIN APPLICATION SCRIPT ---
        // I'll put a placeholder here as the full script is very long.
        // The complete, combined script follows this HTML structure.
    </script>
    <script type="module">
        // --- INTERACTIVE BACKGROUND SCRIPT ---
        const canvas = document.getElementById('interactive-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;
        let particleMouse = { x: null, y: null, radius: (canvas.height/120) * (canvas.width/120) };

        class Particle {
            constructor(x, y, directionX, directionY, size) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY;
                this.size = size;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sub-text-color') + '33';
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                let dx = particleMouse.x - this.x; let dy = particleMouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < particleMouse.radius + this.size) {
                    if (particleMouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 5;
                    if (particleMouse.x > this.x && this.x > this.size * 10) this.x -= 5;
                    if (particleMouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 5;
                    if (particleMouse.y > this.y && this.y > this.size * 10) this.y -= 5;
                }
                this.x += this.directionX; this.y += this.directionY;
                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0,0,innerWidth, innerHeight);
            if(particlesArray) particlesArray.forEach(p => p.update());
        }

        window.addEventListener('mousemove', e => { particleMouse.x = e.x; particleMouse.y = e.y; });
        window.addEventListener('mouseout', () => { particleMouse.x = undefined; particleMouse.y = undefined; });
        window.addEventListener('resize', () => {
            canvas.width = innerWidth; canvas.height = innerHeight;
            particleMouse.radius = (canvas.height/120) * (canvas.width/120);
            initParticles();
        });
        
        initParticles();
        animateParticles();

        // --- GLOBALWAVE APP SCRIPT ---
        const getEl = (id) => document.getElementById(id);
        
        // DOM Elements
        const countrySelect = getEl('country-select'), stationsList = getEl('stations-list'),
              audioPlayer = getEl('audio-player'), nowPlaying = getEl('now-playing'),
              messageDisplay = getEl('message-display'), playerMessage = getEl('player-message'),
              stationFavicon = getEl('station-favicon'), countrySearchInput = getEl('country-search-input'),
              stationSearchInput = getEl('station-search-input'),
              settingsBtn = getEl('settings-btn'), settingsModal = getEl('settings-modal'),
              themeToggle = getEl('theme-toggle'), favoritesBtn = getEl('favorites-btn'),
              playPauseBtn = getEl('play-pause-btn'), nextBtn = getEl('next-btn'),
              prevBtn = getEl('prev-btn'), volumeBtn = getEl('volume-btn'),
              volumeSlider = getEl('volume-slider'), shareBtn = getEl('share-btn'),
              recentsBtn = getEl('recents-btn'), viewToggleBtn = getEl('view-toggle-btn'),
              appContainer = getEl('app-container'), mapContainer = getEl('map-container'),
              timerDisplay = getEl('timer-display'), toastNotification = getEl('toast-notification'),
              backBtn = getEl('back-btn'), findStationsTitle = getEl('find-stations-title'),
              mapLoader = getEl('map-loader'), mapTooltip = getEl('map-tooltip'),
              mapBackBtn = getEl('map-back-btn');

        // Icons
        const playIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
              pauseIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`,
              volumeMaxIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,
              volumeMuteIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`,
              starIconEmpty = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 group-hover:text-amber-500 transition-colors"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>`,
              starIconFilled = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-400 group-hover:text-amber-500 transition-colors"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>`;

        // App State
        let activeApiBase = null, currentStations = [], currentStationIndex = -1, favorites = [],
            recents = [], sleepTimer = null, audioCtx, analyser, isViewMap = false,
            lastSelectedCountryCode = null, allStationsForMap = [];

        // --- Feature: Theme Management ---
        const applyTheme = (isDark) => {
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
            if(themeToggle) themeToggle.checked = isDark;
            initParticles();
        };
        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme === 'dark' || !savedTheme);
        themeToggle.addEventListener('change', () => {
            localStorage.setItem('theme', themeToggle.checked ? 'dark' : 'light');
            applyTheme(themeToggle.checked);
        });

        // --- Feature: Geolocation on Start ---
        const locationBanner = getEl('location-banner');
        const handleGeolocation = () => {
            if (localStorage.getItem('location-permission') || new URLSearchParams(window.location.search).has('station')) {
                locationBanner.classList.add('hidden');
                return;
            }
            // If Pakistan is not the default, ask for location
             if (countrySelect.value !== 'PK') {
                locationBanner.classList.remove('hidden');
             }

        // --- Core API & Station Logic ---
        async function initializeApi() {
            const servers = ['de1.api.radio-browser.info', 'de2.api.radio-browser.info', 'nl1.api.radio-browser.info', 'at1.api.radio-browser.info'];
            for (const server of servers.sort(() => Math.random() - 0.5)) {
                try {
                    const res = await fetch(`https://${server}/json/stats`, { mode: 'cors' });
                    if (res.ok) { activeApiBase = `https://${server}/json`; return; }
                } catch (error) { console.warn(`Server ${server} failed.`); }
            }
            throw new Error('All API servers unreachable.');
        }

        async function isStreamOnline(url) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500); // 2.5 second timeout

            try {
                await fetch(url, { signal: controller.signal, mode: 'no-cors' });
                clearTimeout(timeoutId);
                return true;
            } catch (error) {
                clearTimeout(timeoutId);
                return false;
            }
        }
        
        async function getCountries() {
            try {
                const res = await fetch(`${activeApiBase}/countries?hidebroken=true&order=name`);
                const countries = await res.json();
                countrySelect.innerHTML = '<option value="">Select a country</option>';
                countries.forEach(c => {
                    if (c.name && c.stationcount > 0) countrySelect.insertAdjacentHTML('beforeend', `<option value="${c.iso_3166_1}">${c.name} (${c.stationcount})</option>`);
                });
                countrySelect.disabled = false;

                // Set Pakistan as default if no station is being shared via URL
                const params = new URLSearchParams(window.location.search);
                if (!params.has('station')) {

        async function getStations(countryCode) {
            if (!activeApiBase) return;
            showSkeletonLoaders();
            try {
                const res = await fetch(`${activeApiBase}/stations/bycountrycodeexact/${countryCode}?hidebroken=true&limit=500&order=votes&reverse=true`);
                const allFetchedStations = await res.json() || [];

                if (allFetchedStations.length > 0) {
                    showMessage(`Found ${allFetchedStations.length} stations. Checking which are online...`);

                    const stationChecks = allFetchedStations.map(async (station) => {
                        const isOnline = await isStreamOnline(station.url_resolved);
                        return { station, isOnline };
                    });

                    const results = await Promise.all(stationChecks);
                    const onlineStations = results.filter(res => res.isOnline).map(res => res.station);

                    currentStations = onlineStations;

                    if (onlineStations.length > 0) {
                        displayStations(onlineStations);
                        stationSearchInput.classList.remove('hidden');
                    } else {
                        showMessage(`Could not find any online stations in this country. Please try another.`);
                        stationSearchInput.classList.add('hidden');
                    }
                } else {
                    showMessage(`No stations found.`);
                    stationSearchInput.classList.add('hidden');
                }
            } catch (error) {
                showMessage('Failed to fetch stations.');
                stationSearchInput.classList.add('hidden');
            }
        }

        // --- Player & Audio Logic ---
        function playStation(station) {
            if (!station || !station.url_resolved) {
                playerMessage.textContent = 'Invalid station data.';
                return;
            }
            const stationInCurrentList = currentStations.find(s => s.stationuuid === station.stationuuid);

            currentStationIndex = currentStations.findIndex(s => s.stationuuid === station.stationuuid);
            
            updatePlayerUI(station);
            addRecent(station);
            audioPlayer.src = station.url_resolved;
            audioPlayer.play().catch(e => {
                 playerMessage.textContent = `Stream might be offline or blocked.`;
                 nowPlaying.textContent = 'Playback Failed';

            if (!audioCtx) setupVisualizer(); // Init audio context on first play
        }

        // --- Feature: Sleep Timer ---
        function setSleepTimer(minutes) {
            clearTimeout(sleepTimer);
            if (!minutes) { timerDisplay.textContent = ''; return; }
            
            const endTime = Date.now() + minutes * 60 * 1000;
            const updateTimer = () => {
                 const remaining = Math.round((endTime - Date.now()) / 1000);
                 if (remaining <= 0) {
                     const fadeOut = setInterval(() => {
                         if (audioPlayer.volume > 0.1) audioPlayer.volume -= 0.1;
                         else {
                             audioPlayer.pause();
                             audioPlayer.volume = 1;
                             clearInterval(fadeOut);
                             timerDisplay.textContent = '';
                         }
                     }, 200);
                 } else {
                     const mins = Math.floor(remaining / 60);
                     const secs = remaining % 60;
                     timerDisplay.textContent = `Stops in: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                     sleepTimer = setTimeout(updateTimer, 1000);
                 }
            };
            updateTimer();
        }
        document.querySelectorAll('.sleep-time-btn').forEach(btn => btn.addEventListener('click', (e) => {

        }));

        // --- Feature: Live Audio Visualizer ---
        const visualizerCanvas = getEl('visualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let dataArray, bufferLength;
        
        function setupVisualizer() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 128;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                drawVisualizer();
            } catch(e) {
                console.error("Audio visualizer failed to initialize:", e);
                visualizerCanvas.style.display = 'none';
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if(!analyser || audioPlayer.paused) {
                visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                return;
            };
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            const barWidth = (visualizerCanvas.width / bufferLength) * 1.5;
            let x = 0;
            const grad = visualizerCtx.createLinearGradient(0, 0, 0, visualizerCanvas.height);
            grad.addColorStop(0, '#818cf8');
            grad.addColorStop(1, '#4f46e5');
            visualizerCtx.fillStyle = grad;
            
            for (let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] / 2;
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }
        
        // --- Feature: Interactive Map View (3D Globe) ---
        let scene, camera, renderer, globe, controls, raycaster, stationPoints,
            originalPositions, stationPointData = [], bloomPass, composer;
        const globeMouse = new THREE.Vector2();
        let intersectedPointIndex = -1;
        let lastMouseScreenPosition = { x: 0, y: 0 };
        let isDragging = false;
        let mouseDownPos = new THREE.Vector2();

        function initMap() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            mapContainer.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = 0.2;

            scene.add(new THREE.AmbientLight(0xaaaaaa));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 3, 5);
            scene.add(dirLight);

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg', (texture) => {
                const globeGeometry = new THREE.SphereGeometry(5, 64, 64);
                const globeMaterial = new THREE.MeshPhongMaterial({ map: texture });
                globe = new THREE.Mesh(globeGeometry, globeMaterial);
                scene.add(globe);
            });
            
            camera.position.z = 10;
            
            // --- Post-processing for Bloom Effect ---
            const scriptLoader = (src) => new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                document.head.appendChild(script);
            });

            Promise.all([
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js'),
                scriptLoader('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js')
            ]).then(() => {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 6.5;
                controls.maxDistance = 20;

                const renderScene = new THREE.RenderPass(scene, camera);
                bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
                bloomPass.threshold = 0;
                bloomPass.strength = 0.5;
                bloomPass.radius = 0;

                composer = new THREE.EffectComposer(renderer);
                composer.addPass(renderScene);
                composer.addPass(bloomPass);
            });

            renderer.domElement.addEventListener('mousedown', onMouseDown, false);
            renderer.domElement.addEventListener('mousemove', onMouseMove, false);
            renderer.domElement.addEventListener('mouseup', onMouseUp, false);

            animateMap();
        }
        
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            return new THREE.Vector3(x, y, z);
        }

        async function loadAndPlotStations() {
            mapLoader.classList.remove('hidden');
            try {
                const res = await fetch(`${activeApiBase}/stations?limit=2000&hidebroken=true&has_geo_info=true&order=votes&reverse=true`);
                allStationsForMap = await res.json();
                
                const vertices = [];
                stationPointData = [];
                
                allStationsForMap.forEach(station => {
                    if (station.geo_lat && station.geo_long) {
                        const position = latLonToVector3(station.geo_lat, station.geo_long, 5.01);
                        vertices.push(position.x, position.y, position.z);
                        stationPointData.push(station);
                    }
                });

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                originalPositions = new Float32Array(vertices);

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 1.0 },
                        color: { value: new THREE.Color(0xffffff) }
                    },
                    vertexShader: `
                        uniform float time;
                        attribute float size;
                        void main() {
                            vec3 p = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                            gl_PointSize = 8.0 * (1.0 + sin(time * 0.5 + p.x * 2.0));
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        void main() {
                            if (length(gl_PointCoord - vec2(0.5, 0.5)) > 0.475) discard;
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `,
                    transparent: true
                });


                stationPoints = new THREE.Points(geometry, material);
                scene.add(stationPoints);

            } catch(e) {
                console.error("Failed to load stations for map", e);
                mapLoader.textContent = "Could not load stations.";
                return;
            }
            mapLoader.classList.add('hidden');
        }

        function onMouseDown(event) {
            isDragging = false;
            mouseDownPos.set(event.clientX, event.clientY);
        }
        
        function onMouseMove(event) {
            if (mouseDownPos.distanceTo(new THREE.Vector2(event.clientX, event.clientY)) > 2) {
                isDragging = true;
            }
            event.preventDefault();
            globeMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            globeMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            lastMouseScreenPosition.x = event.clientX;
            lastMouseScreenPosition.y = event.clientY;
        }

        function onMouseUp() {
            if (!isDragging && intersectedPointIndex !== -1) {
                const station = stationPointData[intersectedPointIndex];
                playStation(station);
                toggleView();
            }
        }
        
        function checkIntersections() {
            if (!stationPoints) return;
            raycaster.setFromCamera(globeMouse, camera);
            const intersections = raycaster.intersectObject(stationPoints);
            
            if (intersections.length > 0) {
                const newIndex = intersections[0].index;
                if (newIndex !== intersectedPointIndex) {
                    intersectedPointIndex = newIndex;
                }
                const station = stationPointData[intersectedPointIndex];
                mapTooltip.style.display = 'block';
                mapTooltip.textContent = station.name;
                mapTooltip.style.left = (lastMouseScreenPosition.x + 15) + 'px';
                mapTooltip.style.top = (lastMouseScreenPosition.y) + 'px';
            } else {
                intersectedPointIndex = -1;
                mapTooltip.style.display = 'none';
            }
        }

        function updatePoints() {
            if (!stationPoints) return;
            stationPoints.material.uniforms.time.value += 0.05;
            const positions = stationPoints.geometry.attributes.position.array;
            
            if (intersectedPointIndex === -1) {
                if (stationPoints.geometry.attributes.position.needsUpdate) {
                     stationPoints.geometry.setAttribute('position', new THREE.Float32BufferAttribute(originalPositions, 3));
                     stationPoints.geometry.attributes.position.needsUpdate = false;
                }
                return;
            };

            const intersectedPosition = new THREE.Vector3().fromArray(originalPositions, intersectedPointIndex * 3);
            
            for (let i = 0; i < stationPointData.length; i++) {
                const currentPosition = new THREE.Vector3().fromArray(originalPositions, i * 3);
                const dist = currentPosition.distanceTo(intersectedPosition);

                if(dist < 0.5 && i !== intersectedPointIndex) {
                    const repelVec = new THREE.Vector3().subVectors(currentPosition, intersectedPosition).normalize();
                    const repelStrength = (0.5 - dist) * 0.5;
                    currentPosition.add(repelVec.multiplyScalar(repelStrength));
                }
                currentPosition.toArray(positions, i * 3);
            }
            stationPoints.geometry.attributes.position.needsUpdate = true;
        }


        function animateMap() {
            requestAnimationFrame(animateMap);
            if(controls) controls.update();
            checkIntersections();
            updatePoints();
            if(composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        function toggleView() {
            isViewMap = !isViewMap;
            appContainer.classList.toggle('hidden', isViewMap);
            mapContainer.classList.toggle('hidden', !isViewMap);
            if (isViewMap) {
                if (!scene) initMap();
                if (allStationsForMap.length === 0) loadAndPlotStations();
            }
        }
        
        viewToggleBtn.addEventListener('click', toggleView);
        mapBackBtn.addEventListener('click', toggleView);

        favoritesBtn.addEventListener('click', () => showStoredStations(favorites, 'favorites'));
        recentsBtn.addEventListener('click', () => showStoredStations(recents, 'recents'));
        backBtn.addEventListener('click', () => {
            if (lastSelectedCountryCode) {
                countrySelect.value = lastSelectedCountryCode;
                countrySelect.dispatchEvent(new Event('change'));
            }
        });

        playPauseBtn.addEventListener('click', () => { if (audioPlayer.paused) audioPlayer.play(); else audioPlayer.pause(); });
        nextBtn.addEventListener('click', () => { if (!currentStations.length) return; currentStationIndex = (currentStationIndex + 1) % currentStations.length; playStation(currentStations[currentStationIndex]); });
        prevBtn.addEventListener('click', () => { if (!currentStations.length) return; currentStationIndex = (currentStationIndex - 1 + currentStations.length) % currentStations.length; playStation(currentStations[currentStationIndex]); });
        volumeBtn.addEventListener('click', () => { audioPlayer.muted = !audioPlayer.muted; });
        volumeSlider.addEventListener('input', (e) => { audioPlayer.volume = e.target.value; audioPlayer.muted = e.target.value == 0; });
        audioPlayer.addEventListener('volumechange', updatePlayerControlsState);
        audioPlayer.addEventListener('play', updatePlayerControlsState);
        audioPlayer.addEventListener('pause', updatePlayerControlsState);

        // --- Initial Load ---
        async function main() {
            loadStoredData();
            updatePlayerControlsState();
            try {
                await initializeApi();
                await getCountries();
                await playStationFromURL(); // Check for shared station
                handleGeolocation(); // Ask for location permission
            } catch(error) { showMessage('Could not connect. Please refresh.'); }
        }

        main();
    </script>
</body>
</html>
